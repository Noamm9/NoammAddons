name: Build

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build variants
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5.5.0
        with:
          java-version: "25"
          distribution: microsoft

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          validate-wrappers: true

      - name: Build legit and cheat variants
        run: ./gradlew build --build-cache --no-daemon

      - name: Upload build artifacts
        id: upload-artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NoammAddons-jars
          path: |
            build/libs/*-legit.jar
            build/libs/*-cheat.jar
          if-no-files-found: error
          compression-level: 0

      - name: Add nightly link to summary
        env:
          NIGHTLY_URL: https://nightly.link/${{ github.repository }}/workflows/build/${{ github.ref_name }}/NoammAddons-jars.zip
        run: printf '### Build artifact\n\n[Download NoammAddons-jars](%s)\n' "$NIGHTLY_URL" >> "$GITHUB_STEP_SUMMARY"
