name: Build

on:
  pull_request:
    paths: &build-paths
      - ".gitattributes"
      - ".github/workflows/build.yml"
      - "gradle/**"
      - "src/**"
      - "versions/**/gradle.properties"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "LICENSE"
      - "settings.gradle.kts"
      - "stonecutter.gradle.kts"
  push:
    branches: ["main"]
    paths: *build-paths

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build variants
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          sparse-checkout: |
            /gradle/
            /src/
            /versions/
            /build.gradle.kts
            /gradle.properties
            /gradlew
            /LICENSE
            /settings.gradle.kts
            /stonecutter.gradle.kts
          sparse-checkout-cone-mode: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "25"
          distribution: microsoft
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build all variants
        run: ./gradlew build --build-cache --max-workers=2

      - name: Upload 26.1.2 cheat JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          path: versions/26.1.2-cheat/build/libs/*-cheat.jar
          if-no-files-found: error
          archive: false

      - name: Upload 26.1.2 legit JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          path: versions/26.1.2-legit/build/libs/*-legit.jar
          if-no-files-found: error
          archive: false

      - name: Upload 26.2 cheat JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          path: versions/26.2-cheat/build/libs/*-cheat.jar
          if-no-files-found: error
          archive: false

      - name: Upload 26.2 legit JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          path: versions/26.2-legit/build/libs/*-legit.jar
          if-no-files-found: error
          archive: false

      - name: Upload 26.3 cheat JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          path: versions/26.3-cheat/build/libs/*-cheat.jar
          if-no-files-found: error
          archive: false

      - name: Upload 26.3 legit JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          path: versions/26.3-legit/build/libs/*-legit.jar
          if-no-files-found: error
          archive: false
